<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1440px;overflow:hidden;background:#0b0d12;color:#fff;font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif}
.bg{position:absolute;inset:0;background:radial-gradient(700px 520px at 78% 12%,rgba(255,122,47,.34),transparent 66%),radial-gradient(600px 600px at 8% 88%,rgba(90,120,255,.13),transparent 65%)}
.grid{position:absolute;inset:0;opacity:.3;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:60px 60px;-webkit-mask-image:radial-gradient(ellipse at 50% 45%,#000 25%,transparent 80%);mask-image:radial-gradient(ellipse at 50% 45%,#000 25%,transparent 80%)}
.wrap{position:relative;padding:96px 88px;height:100%;display:flex;flex-direction:column}
.kick{color:#ffb15c;font-size:26px;letter-spacing:.16em}
.title{font-size:140px;line-height:1.02;font-weight:900;letter-spacing:-.05em;margin:48px 0 0}
.title span{background:linear-gradient(100deg,#ffd7a8,#ff8a35 52%,#ff5926);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:38px;color:#c8cdd6;line-height:1.7;margin-top:36px}
.rail{display:flex;gap:14px;margin-top:52px;flex-wrap:wrap;max-width:560px}
.rail span{font-size:25px;color:#b9bfca;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:12px 22px;background:rgba(255,255,255,.05)}
.rail span:first-child{color:#1a0d03;background:linear-gradient(135deg,#ffc078,#ff6a17);border-color:transparent;font-weight:800}
.phone{position:absolute;right:66px;bottom:90px;width:390px;height:640px;border-radius:64px;padding:18px;background:linear-gradient(150deg,#4a4f5c,#101218 45%,#333846);box-shadow:0 40px 90px rgba(0,0,0,.6),inset 0 0 0 2px rgba(255,255,255,.12);transform:rotate(-5deg)}
.screen{border-radius:48px;height:100%;padding:54px 26px 26px;background:radial-gradient(120% 80% at 20% 0%,rgba(255,140,60,.4),transparent 62%),linear-gradient(160deg,#1b1f29,#0d1016);border:1px solid rgba(255,255,255,.08)}
.status{display:flex;justify-content:space-between;font-size:18px;color:#cfd3dc;margin-bottom:70px}
.icons{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 14px}
.ico{aspect-ratio:1;border-radius:26px;display:grid;place-items:center;font-size:20px;font-weight:700;box-shadow:inset 0 2px 4px rgba(255,255,255,.35),0 8px 16px rgba(0,0,0,.35)}
.ico:nth-child(1){background:linear-gradient(145deg,#68d388,#1c9b52)}.ico:nth-child(2){background:linear-gradient(145deg,#7fd0ff,#2688d8)}.ico:nth-child(3){background:linear-gradient(145deg,#ffd27a,#e58f21)}.ico:nth-child(4){background:linear-gradient(145deg,#c3c9d6,#7b8496)}
.ico:nth-child(5){background:linear-gradient(145deg,#ffad7a,#d1521d)}.ico:nth-child(6){background:linear-gradient(145deg,#8ec9ff,#3f6fd1)}.ico:nth-child(7){background:linear-gradient(145deg,#4d5565,#1a1e28)}.ico:nth-child(8){background:linear-gradient(145deg,#ff9d9d,#cb4b4b)}
.foot{margin-top:auto;font-size:26px;color:#7d8491;letter-spacing:.05em}
.foot b{color:#ff8a3d}
</style></head><body>
<div class="bg"></div><div class="grid"></div>
<div class="wrap">
  <div class="kick">2010 — 2025 · 粉丝自制怀旧互动</div>
  <h1 class="title">MIUI<br><span>时间胶囊</span></h1>
  <div class="sub">横滑时间轴，从 MIUI 1 走到 HyperOS。<br>每一站，都藏着你用过的那个界面。</div>
  <div class="rail"><span>2010 起点</span><span>10 个时代</span><span>10 个小场景</span><span>米粉身份证</span></div>
  <div class="foot">Vibe Coding 参赛作品 · <b>非小米官方发布</b></div>
</div>
<div class="phone"><div class="screen"><div class="status"><span>9:41</span><span>●●● ▰</span></div>
<div class="icons"><div class="ico">电话</div><div class="ico">短信</div><div class="ico">相机</div><div class="ico">设置</div><div class="ico">主题</div><div class="ico">天气</div><div class="ico">时钟</div><div class="ico">日历</div></div></div></div>
</body></html>
